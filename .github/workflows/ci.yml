name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The fast checks and the integration tests run side by side (TASK-076). The
# integration tests are split into the parts of the matrix below; every file
# is in exactly one part (apps/api/src/testing/integration-shards.ts). The
# last job, `ci`, is the one result of the run: green only when everything
# above is green.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract compatibility check reads openapi.json at the base
          # revision and commit trailers since it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The icon path modules match design/icons and nothing unused is vendored (TASK-030.A).
      - name: Icons are generated from design/icons
        run: pnpm icons --check

      # Includes the checks of the complete lists (routes, jobs, migrations) and
      # of the split of the integration tests (apps/api/src/testing).
      - name: Test
        run: pnpm test

      # Also exports the mobile JS bundle for iOS and Android (apps/mobile build).
      - name: Build
        run: pnpm build

      - name: OpenAPI document is up to date with contracts and served routes
        run: pnpm --filter @adclub/api openapi:check

      - name: API contract is backward compatible
        env:
          # PR: the target branch. Push to main: the previous main commit.
          BASE_REV: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REV" ] || [ "$BASE_REV" = "0000000000000000000000000000000000000000" ]; then
            BASE_REV="HEAD~1"
          fi
          pnpm --filter @adclub/api openapi:compat --base "$BASE_REV"

      # ARCHITECTURE 7.2, 4.81 (TASK-056): the server keeps every published
      # app version working — compared with the contract snapshot of each
      # version in contract-snapshots/mobile/supported.json, one after another.
      - name: API contract keeps every supported app version working
        env:
          BASE_REV: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REV" ] || [ "$BASE_REV" = "0000000000000000000000000000000000000000" ]; then
            BASE_REV="HEAD~1"
          fi
          pnpm --filter @adclub/api openapi:compat --snapshots --trailers-since "$BASE_REV"

      - name: Verify API and worker shut down gracefully on SIGTERM (Linux)
        run: pnpm --filter api run verify:graceful-shutdown

  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every part runs to its end, so one run shows all the failures at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages the API imports from their built form.
      - name: Build the packages the API uses
        run: pnpm turbo run build --filter="@adclub/api^..."

      # Five runners ask Docker Hub for the same images at once, and a test file
      # that fails to pull its image fails with a registry timeout. The images are
      # pulled here, with pauses between attempts, and the tests find them local.
      # This retries the download of an image, never a test.
      - name: Pull the images the tests start
        run: |
          RYUK=$(grep -rhoE 'testcontainers/ryuk:[0-9.]+' apps/api/node_modules/testcontainers/build | head -1)
          pull() {
            for attempt in 1 2 3 4; do
              docker pull -q "$1" > /dev/null && return 0
              sleep $((attempt * 5))
            done
            echo "Could not pull $1"
            return 1
          }
          pids=""
          for image in postgres:16 redis:7 bitnamilegacy/minio:2025.7.23-debian-12-r5 "$RYUK"; do
            pull "$image" &
            pids="$pids $!"
          done
          for pid in $pids; do
            wait "$pid" || exit 1
          done

      # The part is computed from the files on disk. Before it runs, the script
      # checks that all parts together hold every *.integration.test.ts once;
      # no retry: an unstable test fails honestly.
      - name: Integration tests, part ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: pnpm --filter @adclub/api test:integration:shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The native configuration of the app without an Expo account (TASK-056,
  # ARCHITECTURE 4.81): `expo config`, `expo prebuild --no-install` for
  # Android and iOS (Linux generates both; no pod install, no Gradle), the
  # generated manifest and Info.plist read for push, the background task and
  # OTA, and expo-doctor. The generated android/ and ios/ are thrown away.
  mobile-native:
    name: mobile native config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: expo config, expo prebuild (android, ios), expo-doctor
        run: pnpm --filter mobile native:check

  # The images of the staging stack (TASK-055, ARCHITECTURE 4.82), on a push
  # to main only: api (API, worker, operator command, release step), ops
  # (backups, restore check, sops), and the two web clients built for the
  # staging API address. Tags: sha-<7 hex> (what deploys) and main; never
  # `latest`. Code without data — GHCR outside Kazakhstan is allowed (8.5).
  # .github/workflows/deploy-staging.yml deploys them once this run is green.
  images:
    name: images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: adclub-api
            dockerfile: infra/docker/api.Dockerfile
            app: api
          - image: adclub-ops
            dockerfile: infra/docker/ops.Dockerfile
            app: ""
          - image: adclub-supplier-web-staging
            dockerfile: infra/docker/web.Dockerfile
            app: supplier-web
          - image: adclub-admin-web-staging
            dockerfile: infra/docker/web.Dockerfile
            app: admin-web
    steps:
      - uses: actions/checkout@v4

      - name: Tags and version
        id: meta
        env:
          APP: ${{ matrix.app }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          short="${GITHUB_SHA::7}"
          version=""
          if [ -n "$APP" ]; then version="$(jq -r .version "apps/$APP/package.json")"; fi
          {
            echo "tags=${IMAGE}:sha-${short},${IMAGE}:main"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            APP=${{ matrix.app }}
            VITE_API_URL=${{ vars.STAGING_API_URL || 'https://api.staging.adclub.kz' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ci:
    name: ci
    needs: [checks, integration, mobile-native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Everything is green
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          MOBILE_NATIVE: ${{ needs.mobile-native.result }}
        run: |
          echo "checks=$CHECKS integration=$INTEGRATION mobile-native=$MOBILE_NATIVE"
          if [ "$CHECKS" != "success" ] || [ "$INTEGRATION" != "success" ] || [ "$MOBILE_NATIVE" != "success" ]; then
            exit 1
          fi
