<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Asia Drive Club</title>
    <script>
      // Applies the stored theme before the first paint (ThemeProvider takes over after load).
      try {
        var mode = localStorage.getItem("adclub.admin-web.theme");
      } catch (error) {}
      if (mode === "system")
        mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
