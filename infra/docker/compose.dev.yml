name: adclub-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adclub}
      POSTGRES_DB: ${POSTGRES_DB:-adclub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adclub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-adclub-dev-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned, not `latest` (D-016: tool/image versions are reproducible, not
    # floating). MinIO's own images (`quay.io/minio/minio` and Docker Hub's
    # `minio/minio`) stopped serving anonymous pulls — «unauthorized: access
    # to the requested resource is not authorized» — so the image is the
    # same MinIO server packaged by Bitnami, which pulls without an account.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    # This image runs as a non-root user, and a named volume belongs to root:
    # as itself it can't even write the data directory. Running it as root in
    # the development stack is the simplest way out (production storage is a
    # managed S3, not this container).
    user: root
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-adclub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-adclub-dev-secret}
      # Start the server once (ARCHITECTURE 4.34 I351). Left to itself this
      # image starts MinIO, uses it to configure `mc` and to create
      # MINIO_DEFAULT_BUCKETS, *stops* it and starts it again — and while it
      # is down the port is closed, so a request in flight dies with «socket
      # hang up» and an upload answers 503. The bucket is created by the
      # command below instead, beside the running server.
      MINIO_SKIP_CLIENT: "yes"
      # The bucket the API stores files in (TASK-013): MinIO starts with
      # none, and an upload to a bucket that isn't there fails with an error
      # that explains nothing. The command below creates it.
      S3_BUCKET: ${S3_BUCKET:-adclub-dev}
    # Runs the server the image's own way, and beside it — once the server
    # really serves — configures `mc` and creates the bucket. Both are the
    # one process tree this image starts, so the server is never stopped
    # and started again.
    command:
      - /bin/sh
      - -c
      - |
        (
          until curl -fsS http://127.0.0.1:9000/minio/health/cluster >/dev/null 2>&1; do sleep 1; done
          mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
          mc mb --ignore-existing "local/$$S3_BUCKET"
        ) &
        exec /opt/bitnami/scripts/minio/run.sh
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # Healthy means the storage takes object calls *and* the bucket is
      # there — the two things an upload needs. `/minio/health/live`, which
      # only says the process listens, answered even while the image was
      # restarting the server (ARCHITECTURE 4.34 I351).
      test: ["CMD-SHELL", 'mc ls "local/$$S3_BUCKET" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  minio-data:
