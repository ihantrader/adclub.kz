name: adclub-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adclub}
      POSTGRES_DB: ${POSTGRES_DB:-adclub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adclub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-adclub-dev-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned, not `latest` (D-016: tool/image versions are reproducible, not
    # floating) — RELEASE tags are how MinIO versions its images.
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-adclub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-adclub-dev-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket the API stores files in (TASK-013): MinIO starts
  # with none, and an upload to a bucket that isn't there fails with an
  # error that explains nothing. Runs once and exits; `docker compose up`
  # runs it again after a restart, where it finds the bucket and stops.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-adclub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-adclub-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-adclub-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  minio-data:
